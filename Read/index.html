<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>READ - TOP OF THE WORLD</title>

        <base href="../">

        <link href="Styles/base.css" rel="stylesheet">
        <link href="Styles/comic.css" rel="stylesheet">
    </head>
    <body class="flex" style="overflow: hidden;">
        <h1 id="header">TOP OF THE WORLD</h1>
        <div class="grow">
            <div class="comic">
                <img src="SMART://TOTW #1 - Cover" class="comicPage">
                <img src="SMART://Blank" class="comicPage">
                <img src="SMART://TOTW #1 - Pg.1" class="comicPage">
                <img src="SMART://TOTW #1 - Pg.2" class="comicPage">
                <img src="SMART://TOTW #1 - Pg.3" class="comicPage">

                <img src="SMART://TOTW #1 - Pg.5" class="comicPage">
            </div>
        </div>
        <footer>
            <div class="flex horizontal" style="align-items: center;">
                <h3>Controls:</h3>
                <p>- Next page [D]</p>
                <p>- Prev page [A]</p>
                <p>- Next chapter [S]</p>
                <p>- Previous chapter [W]</p>
                <p>- Go Home [1]</p>
            </div>
        </footer>

        <script src="Read/script.js" type="module"></script>
